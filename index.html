<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <h1 id="titleHome">Riichi Scoring Trainer</h1>
      <div class="sub">read the hand, name the han, count the fu, call the score</div>
    </div>
    <div class="masthead-right">
      <button class="hamburger-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
      <div class="menu-panel" id="menuPanel">
        <div class="menu-section">
          <div class="menu-title">Settings</div>
          <div class="menu-links">
            <button class="menu-link-btn" id="btnRules">Rules &amp; test settings</button>
          </div>
        </div>
        <div class="menu-section">
          <div class="menu-title">Reference</div>
          <div class="menu-links">
            <button class="menu-link-btn" id="btnYakuRef">Yaku list</button>
            <button class="menu-link-btn" id="btnFuRef">Fu calculation</button>
            <button class="menu-link-btn" id="btnPointsRef">Han + Fu → Points table</button>
          </div>
        </div>
        <div class="menu-section">
          <div class="menu-title">Study</div>
          <div class="menu-links">
            <button class="menu-link-btn" id="btnFlashcards">Japanese terms (flashcards)</button>
          </div>
        </div>
        <div class="menu-section">
          <div class="menu-title">Review</div>
          <div class="menu-links">
            <button class="menu-link-btn" id="btnMistakes">Mistakes (0)</button>
          </div>
        </div>
        <div class="menu-credit">Heavily inspired by <a href="https://scoringtrainer.konbamwa.net/" target="_blank" rel="noopener">scoringtrainer.konbamwa.net</a></div>
      </div>
    </div>
  </div>

  <div class="masthead-bottom-row" id="practiceBar">
    <div class="streak"><b id="scoreCorrect">0</b>/<span id="scoreTotal">0</span> correct</div>
    <button class="deal-btn" id="dealBtn">Deal a hand</button>
  </div>

  <div class="masthead-bottom-row" id="replayBar" style="display:none">
    <div class="streak"><span id="replayRemaining">0</span> left to review</div>
    <button class="deal-btn" id="exitReplayBtn">Exit replay</button>
  </div>

  <div class="card" id="handCard">
    <div class="empty-note">Press "Deal a hand" to get started.</div>
  </div>

  <div class="result-card" id="resultCard"></div>

  <div class="card mistakes-view" id="mistakesView" style="display:none">
    <div class="mistakes-header">
      <h2>Mistakes</h2>
      <div class="mistakes-actions">
        <button class="deal-btn" id="replayMistakesBtn">Replay these</button>
        <button class="clear-btn" id="backToPracticeBtn">Back</button>
      </div>
    </div>
    <div id="mistakesList"></div>
  </div>

  <div class="card flashcards-view" id="flashcardsView" style="display:none">
    <div class="mistakes-header">
      <h2>Japanese Terms</h2>
      <div class="mistakes-actions">
        <button class="clear-btn" id="flashShuffleBtn">Shuffle</button>
        <button class="clear-btn" id="backFromFlashcardsBtn">Back</button>
      </div>
    </div>
    <div class="flashcard-progress" id="flashcardProgress"></div>
    <div class="flashcard-box" id="flashcardBox"></div>
    <div class="flashcard-controls">
      <button class="clear-btn" id="flashPrevBtn">◀ Prev</button>
      <button class="deal-btn" id="flashFlipBtn">Flip</button>
      <button class="clear-btn" id="flashNextBtn">Next ▶</button>
    </div>
  </div>

</div>

<div class="overlay-backdrop" id="overlayBackdrop">
  <div class="overlay-content" id="overlayContent"></div>
</div>

<script src="tile-data.js"></script>
<script src="utils.js"></script>
<script src="tile-graphics.js"></script>
<script src="hand-builder.js"></script>
<script src="scoring.js"></script>
<script src="state.js"></script>
<script src="ui.js"></script>
</body>
</html>
